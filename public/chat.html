<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socket.IO Test Client</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(20, 27, 45, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .title-group h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .title-group p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--danger);
      box-shadow: 0 0 10px var(--danger);
      transition: background-color 0.3s, box-shadow 0.3s;
    }

    .status-badge.connected .status-dot {
      background-color: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    .client-info {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.2);
      padding: 0.6rem 0.9rem;
      border-radius: 10px;
    }

    .events-panel {
      background: rgba(5, 8, 16, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      height: 260px;
      overflow-y: auto;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      scroll-behavior: smooth;
    }

    .event-item {
      padding: 0.45rem 0.7rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      border-left: 3px solid var(--accent);
      word-break: break-all;
    }

    .event-item.system {
      border-left-color: var(--success);
    }

    .event-item.broadcast {
      border-left-color: #ec4899;
    }

    .event-meta {
      color: var(--text-muted);
      font-size: 0.725rem;
      margin-bottom: 0.2rem;
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 1.4rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-group">
        <h1>Socket.IO Server</h1>
        <p>Live WebSocket Communication Test</p>
      </div>
      <div class="status-badge" id="statusBadge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Disconnected</span>
      </div>
    </header>

    <div class="client-info">
      <span>Socket ID: <strong id="socketId">None</strong></span>
      <span>Transport: <strong id="transport">N/A</strong></span>
    </div>

    <div class="events-panel" id="eventsPanel"></div>

    <form class="input-row" id="messageForm">
      <input type="text" id="messageInput" placeholder="Type a message to emit..." autocomplete="off" required />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const socketIdSpan = document.getElementById('socketId');
    const transportSpan = document.getElementById('transport');
    const eventsPanel = document.getElementById('eventsPanel');
    const messageForm = document.getElementById('messageForm');
    const messageInput = document.getElementById('messageInput');

    function logEvent(type, title, payload) {
      const el = document.createElement('div');
      el.className = 'event-item ' + type;
      const now = new Date().toLocaleTimeString();
      let message = ""
      if (typeof payload === 'object') {
        if (payload.message) message = payload.message;
        else if (payload.data) message = payload.data;
        else message = JSON.stringify(payload);
      } else {
        message = payload;
      }
      if (message)
      el.innerHTML = '<div class="event-meta">[' + now + '] ' + title + '</div>' + 
        '<div>' + message + '</div>';
      console.log(payload)
      eventsPanel.appendChild(el);
      eventsPanel.scrollTop = eventsPanel.scrollHeight;
    }

    socket.on('connect', () => {
      statusBadge.classList.add('connected');
      statusText.textContent = 'Connected';
      socketIdSpan.textContent = socket.id;
      transportSpan.textContent = socket.io.engine.transport.name;
      logEvent('system', 'Connection Established', 'Connected with ID: ' + socket.id);

      socket.io.engine.on('upgrade', () => {
        transportSpan.textContent = socket.io.engine.transport.name;
      });
    });

    socket.on('welcome', (data) => {
      logEvent('system', 'Event: welcome', data);
    });

    socket.on('message', (data) => {
      logEvent('broadcast', 'Event: message', data);
    });

    socket.on('disconnect', (reason) => {
      statusBadge.classList.remove('connected');
      statusText.textContent = 'Disconnected';
      socketIdSpan.textContent = 'None';
      transportSpan.textContent = 'N/A';
      logEvent('system', 'Disconnected', reason);
    });

    messageForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;
      socket.emit('message', text);
      messageInput.value = '';
    });
  </script>
</body>
</html>
